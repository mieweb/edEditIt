name: Build and publish VSC extension

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get tag version
        id: get_tag_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npx vsce package ${{ steps.get_tag_version.outputs.VERSION }} --no-git-tag-version

      - name: Upload VSIX to release
        uses: softprops/action-gh-release@v2
        with:
          files: ededitit-${{ steps.get_tag_version.outputs.VERSION }}.vsix
